; lite-brite firmware
;
;   pio run                      build for the default board (Seeed XIAO ESP32-S3)
;   pio run -t upload            build and flash over USB
;   pio device monitor           serial log (115200 baud)
;   pio test -e native           unit tests on your computer
;   pio run -e sim               build the desktop simulator (see tools/preview.py)
;
; Before the first build: copy include/secrets.example.h to include/secrets.h
; and fill in Wi-Fi and MQTT details. Pins and matrix layout live in
; include/config.h and can be overridden per environment with build_flags.

[platformio]
default_envs = xiao_esp32s3

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.4.2

; ---------------------------------------------------------------------------
; ESP32 targets. pioarduino's platform provides Arduino-ESP32 3.x (ESP-IDF 5.5).
[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<sim/>
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -D CORE_DEBUG_LEVEL=0

; Reference hardware: Seeed Studio XIAO ESP32-S3 on battery with a PIR sensor.
[env:xiao_esp32s3]
extends = esp32
board = seeed_xiao_esp32s3
build_flags =
    ${esp32.build_flags}
    -D LB_BOARD_NAME=\"XIAO-ESP32S3\"

; Same board, flashed over Wi-Fi. Turn on "Stay awake" in Home Assistant
; first (a sleeping sign can't take an update), then:
;   LB_OTA_PASSWORD=... pio run -e xiao_esp32s3_ota -t upload
[env:xiao_esp32s3_ota]
extends = env:xiao_esp32s3
upload_protocol = espota
upload_port = lite-brite-entryway.local
upload_flags = --auth=${sysenv.LB_OTA_PASSWORD}

; An ESP32-S3 DevKitC on USB power: handy on the bench. Never sleeps.
[env:esp32s3_devkitc]
extends = esp32
board = esp32-s3-devkitc-1
build_flags =
    ${esp32.build_flags}
    -D LB_BOARD_NAME=\"ESP32-S3-DevKitC\"
    -D LB_ALWAYS_POWERED=1
    -D LB_PIN_VBAT=-1

; ---------------------------------------------------------------------------
; Host builds. Need a C++17 compiler (gcc/clang) on your computer.
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Wno-unused-parameter

[env:sim]
platform = native
build_src_filter = -<*> +<sim/>
build_flags = -std=c++17 -O2 -Wall -Wextra -Wno-unused-parameter
